##
## docker compose file for DanteWiki
##


# CURRENTLY in USE are:    database webserver-raw-https phpmyadmin 


services:

## a database running on backing store which as a file is part of the container
  database:
    image: mariadb:10.5
    ports:
      - "3306:3306"
    container_name: dante-mariadb-container
    networks:
      - dante-network
    secrets:
     - configuration
    environment:
      MARIADB_ROOT_PASSWORD: initialPassword

## a database running on backing store which is a named volume, separate from the container
  database-volume:
    image: mariadb:10.5
    ports:
      - "3306:3306"
    container_name: dante-mariadb-container
    networks:
      - dante-network
    secrets:
     - configuration
    volumes:
      - data:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: initialPassword


## starts a container which has not been initialized but which does not require a copy to the development environment
## runs not off a volume but off the container itself
  webserver-raw-https:
    environment:
      - COMPOSER_IDENTITY=webserver-raw-https
     # Use the locally built image (bin/library.sh: build / buildNoCache tag it as dante-wiki:latest),
    # NOT clecap/dante-wiki:latest from dockerhub. Otherwise bin/build-run-raw.sh builds an image and
    # then runs whatever stale copy of the dockerhub image happens to be on this machine.
     # set by getImageInfo in bin/library.sh. Compose substitutes variables in the whole file on every command
     # (also on "down"), so ":-" defaults to empty and silences the "variable is not set" warnings when unset.
     # No quotes: in this list syntax quotes would become part of the value.
      - IMAGE_ID=${IMAGE_ID:-}
      - IMAGE_DIGEST=${IMAGE_DIGEST:-}
      - IMAGE_REPOSITORY=${IMAGE_REPOSITORY:-}
      - IMAGE_CREATED_AT=${IMAGE_CREATED_AT:-}
      - IMAGE_TAG=${IMAGE_TAG:-}    
    image: dante-wiki:latest
    hostname: ${MY_DOMAINNAME}      
    container_name: dante-wiki-container
    ports:
      - "${HOST_HTTPS_PORT}:443"
    secrets:
      - configuration
    networks: 
      dante-network:
        aliases: 
          - dante.local
    command: "prepare-database.sh install-webserver-certificate.sh get-dante.sh get-parsifal.sh generate-mediawiki-private.sh init.sh set-user-preferences.sh run-apache.sh"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5


## todo: why do we need get-ante and get-parsifal twice??
## is the depends_on really working here or is it superfluous??
## TODO: http or https ?????????????????????????
  webserver-after-copy:
    environment:
      - COMPOSER_IDENTITY=webserver-after-copy
      # set by getImageInfo in bin/library.sh. Compose substitutes variables in the whole file on every command
      # (also on "down"), so ":-" defaults to empty and silences the "variable is not set" warnings when unset.
      # No quotes: in this list syntax quotes would become part of the value.
      - IMAGE_ID=${IMAGE_ID:-}
      - IMAGE_DIGEST=${IMAGE_DIGEST:-}
      - IMAGE_REPOSITORY=${IMAGE_REPOSITORY:-}
      - IMAGE_CREATED_AT=${IMAGE_CREATED_AT:-}
      - IMAGE_TAG=${IMAGE_TAG:-}
    image: dante-wiki:latest
    hostname: ${MY_DOMAINNAME}      
    container_name: dante-wiki-container
    depends_on:
      copy-to-host:
        condition: service_completed_successfully
    volumes:
      - ../live:/var/www/html
    ports:
      - "8080:80"
      - "4443:443"
    secrets:
      - configuration
    networks: 
      dante-network:
        aliases: 
          - dante.local
    command: "install-webserver-certificate.sh chown.sh set-user-preferences.sh  run-apache.sh"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5


## starts a container which has not been initialized but which does not require a copy to the development environment
## runs not off a volume but off the container itself
  webserver-raw-http:
    environment:
      - COMPOSER_IDENTITY=webserver-raw-http
    image: dante-wiki:latest
    hostname: ${MY_DOMAINNAME}      
    container_name: dante-wiki-container
    ports:
      - "${HOST_HTTP_PORT}:80"
    secrets:
      - configuration
    networks: 
      dante-network:
        aliases: 
          - dante.local
    command: "prepare-database.sh install-webserver-certificate.sh get-dante.sh get-parsifal.sh generate-mediawiki-private.sh init.sh set-user-preferences.sh run-apache.sh"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5



## start a container which has already been initialized
  webserver-cooked:
    environment:
      - COMPOSER_IDENTITY=webserver-cooked
    image: dante-wiki:cooked
    hostname: ${MY_DOMAINNAME}      
    container_name: dante-wiki-container
    ports:
      - "8080:80"
      - "4443:443"
    secrets:
      - configuration
    networks: 
      dante-network:
        aliases: 
          - dante.local
    command: "prepare-database.sh restore-initial-sql.sh chown.sh run-apache.sh"

# TODO: waiting for mysql: maybe we can put this into a health check ?!?!? in a better way than thus far ????


  phpmyadmin:
    image: phpmyadmin:5.2.3
    ports: 
      - "9090:80"
    container_name: php-myadmin-container
    networks: 
      dante-network:
        aliases:
          - phpmyadmin.local
    environment:
      PMA_HOST: dante-mariadb-container
    depends_on:
      - database


networks:
  dante-network:
    driver: bridge   # TODO testing only for nfs !

volumes:
  data:
    external: true
  live-ext:
    external: true

secrets:
  configuration:
    file: ../private/configuration.sh