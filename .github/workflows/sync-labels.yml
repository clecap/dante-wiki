name: Sync Labels

# Creates and updates the issue labels of this repository from .github/scripts/labels.yaml
on:
  push:
    branches: [ master ]
    paths:
      - '.github/scripts/labels.yaml'
      - '.github/workflows/sync-labels.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/scripts/labels.yaml
          # keep labels which exist on GitHub but are not listed in the yaml file
          skip-delete: true
