name: Generate SBOM for Dockerfiles

# Reusable workflow, called by docker-multiarch-build.yml right after the image has been pushed.
# It scans exactly the pushed image (by digest, not by the tag "latest"), so the SBOM on GitHub Pages
# always describes the image that is actually published, and the repository at the commit it was built from.
# A push to master without a new image does not change the published image, so the Pages SBOM stays correct.
# Only master publishes; GitHub Pages only allows deployments from the default branch (environment "github-pages").
# The Docker image additionally carries its own SBOM attestation (--sbom=true in docker-multiarch-build.yml).
on:
  workflow_call:
    inputs:
      image:
        description: 'Image reference including digest, e.g. clecap/dante-wiki@sha256:...'
        required: true
        type: string
      version:
        description: 'DANTE_VERSION built into the image (git describe)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sbom-generation
  cancel-in-progress: false

jobs:
  generate-sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # In a called workflow this checks out the commit of the caller, i.e. the commit the image was built from
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install syft (Anchore CLI)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
          syft version

      - name: Generate SBOM for Docker image and repo
        env:
          IMAGE:   ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p sbom
          # --platform: the image is multi-arch; the SBOM describes the amd64 variant
          syft "$IMAGE" --platform linux/amd64 \
            -o json=sbom/sbom-dante-wiki-docker.json \
            -o table=sbom/sbom-dante-wiki-docker.txt \
            -o spdx-tag-value=sbom/sbom-dante-wiki-docker.spdx
          syft dir:. \
            -o json=sbom/sbom-dante-wiki-repo.json \
            -o table=sbom/sbom-dante-wiki-repo.txt \
            -o spdx-tag-value=sbom/sbom-dante-wiki-repo.spdx
          # record which image and commit these SBOMs describe
          {
            echo "image:   $IMAGE"
            echo "version: $VERSION"
            echo "commit:  $GITHUB_SHA"
            echo "date:    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > sbom/IMAGE.txt
          cat sbom/IMAGE.txt >> "$GITHUB_STEP_SUMMARY"
          ls -alg sbom

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: sbom

  deploy-pages:
    needs: generate-sbom
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
