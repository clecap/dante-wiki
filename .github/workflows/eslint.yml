# Do a scanning of the Javascript Files of this repository
# Results will be available at Github: Security / Code Scanning Alerts
#

name: ESLint to Security / Code Scanning Alerts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Harden Runnerc
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Versions and sha512 integrity hashes are pinned in .github/eslint/package-lock.json
      - name: Install ESLint
        run: npm ci --prefix .github/eslint --ignore-scripts

      - name: Run ESLint
        run: .github/eslint/node_modules/.bin/eslint .
          --config .eslintrc.js
          --ext .js,.jsx,.ts,.tsx
          --ignore-pattern .github/eslint/
          --format ./.github/eslint/node_modules/@microsoft/eslint-formatter-sarif/sarif.js
          --output-file eslint-results.sarif
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
